naftiko: 1.0.0-alpha2
info:
  label: TD SYNNEX StreamOne Ion API — Provisioning Templates
  description: 'TD SYNNEX StreamOne Ion API — Provisioning Templates. 2 operations. Lead operation: Get Provisioning Template.
    Self-contained Naftiko capability covering one Tech Data business surface.'
  tags:
  - Tech Data
  - Provisioning Templates
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TECH_DATA_API_KEY: TECH_DATA_API_KEY
capability:
  consumes:
  - type: http
    namespace: streamone-ion-provisioning-templates
    baseUri: https://ion.tdsynnex.com/api
    description: TD SYNNEX StreamOne Ion API — Provisioning Templates business capability. Self-contained, no shared references.
    resources:
    - name: v3-accounts-accountId-provisioning-template-templateId
      path: /v3/accounts/{accountId}/provisioning/template/{templateId}
      operations:
      - name: getprovisioningtemplate
        method: GET
        description: Get Provisioning Template
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: templateId
          in: path
          type: string
          description: The provisioning template identifier.
          required: true
    - name: v3-accounts-accountId-provisioning-vendor-vendorId
      path: /v3/accounts/{accountId}/provisioning/vendor/{vendorId}
      operations:
      - name: getprovisioningbyvendor
        method: GET
        description: Get Provisioning Templates by Vendor
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: vendorId
          in: path
          type: string
          description: The vendor identifier.
          required: true
    authentication:
      type: bearer
      token: '{{env.TECH_DATA_API_KEY}}'
  exposes:
  - type: rest
    namespace: streamone-ion-provisioning-templates-rest
    port: 8080
    description: REST adapter for TD SYNNEX StreamOne Ion API — Provisioning Templates. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/v3/accounts/{accountid}/provisioning/template/{templateid}
      name: v3-accounts-accountid-provisioning-template-templateid
      description: REST surface for v3-accounts-accountId-provisioning-template-templateId.
      operations:
      - method: GET
        name: getprovisioningtemplate
        description: Get Provisioning Template
        call: streamone-ion-provisioning-templates.getprovisioningtemplate
        with:
          templateId: rest.templateId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v3/accounts/{accountid}/provisioning/vendor/{vendorid}
      name: v3-accounts-accountid-provisioning-vendor-vendorid
      description: REST surface for v3-accounts-accountId-provisioning-vendor-vendorId.
      operations:
      - method: GET
        name: getprovisioningbyvendor
        description: Get Provisioning Templates by Vendor
        call: streamone-ion-provisioning-templates.getprovisioningbyvendor
        with:
          vendorId: rest.vendorId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: streamone-ion-provisioning-templates-mcp
    port: 9090
    transport: http
    description: MCP adapter for TD SYNNEX StreamOne Ion API — Provisioning Templates. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: get-provisioning-template
      description: Get Provisioning Template
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: streamone-ion-provisioning-templates.getprovisioningtemplate
      with:
        templateId: tools.templateId
      outputParameters:
      - type: object
        mapping: $.
    - name: get-provisioning-templates-vendor
      description: Get Provisioning Templates by Vendor
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: streamone-ion-provisioning-templates.getprovisioningbyvendor
      with:
        vendorId: tools.vendorId
      outputParameters:
      - type: object
        mapping: $.
