  name: TD SYNNEX Digital Bridge API
  description: >-
    Digital Bridge is TD SYNNEX's integration platform providing enterprise-grade REST APIs and pre-built
    connectors. Engineering teams get direct access to APIs for products, pricing, orders, renewals, and
    cloud services. Developers can test endpoints via Swagger and integrate live TD SYNNEX data into existing
    workflows using low-code tools like Make.com and Zapier or by building directly on the APIs.
