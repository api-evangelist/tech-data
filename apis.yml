name: Tech Data
description: >-
  Tech Data (now TD SYNNEX) is one of the world's largest IT distributors and solutions aggregators, serving as an
  intermediary between technology vendors and resellers. The company merged with SYNNEX in 2021 to form TD SYNNEX. TD
  SYNNEX exposes the StreamOne Ion API platform for reseller partners to manage customers, products, orders,
  subscriptions, and cloud services programmatically. The Digital Bridge platform provides pre-built connectors and
  enterprise-grade APIs for live pricing, inventory, and order workflows.
